# Local profile without Docker: in-memory H2 in PostgreSQL mode.
spring.docker.compose.enabled=false
spring.datasource.url=jdbc:h2:mem:punch-list-db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
