spring.application.name=punch-list-api
server.port=${PORT:8080}
spring.banner.location=classpath:/static/banner-start-api.txt
spring.threads.virtual.enabled=true

# Web
spring.jpa.open-in-view=false
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.serialization-mode=via-dto
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# OpenAPI
springdoc.api-docs.path=/api-docs

# Persistence (datasource comes from env vars, docker compose in dev or Testcontainers in tests)
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/changelog-master.xml
spring.liquibase.contexts=${LIQUIBASE_CONTEXTS:demo}
# Keep the changelog history in a fixed schema: the PostgreSQL search_path ("$user", public) changes once the
# punch_list schema exists when the DB user is also named punch_list, which used to split the history.
spring.liquibase.liquibase-schema=public
spring.h2.console.enabled=false

# Actuator: only health, without details
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
